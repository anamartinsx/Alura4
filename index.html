<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aventura Mágica</title>

<style>
body {
font-family: Arial, sans-serif;
background: linear-gradient(120deg, #20124d, #674ea7);
color: white;
text-align: center;
padding: 30px 15px;
margin: 0;
min-height: 100vh;
box-sizing: border-box;
}

.caixa {
max-width: 650px;
margin: 40px auto;
background: white;
color: #333;
padding: 30px;
border-radius: 20px;
box-shadow: 0 5px 20px #00000040;
}

h1 {
color: #674ea7;
}

#texto {
font-size: 18px;
line-height: 1.7;
margin: 25px 0;
}

button {
display: block;
width: 100%;
padding: 15px;
margin: 12px 0;
border: none;
border-radius: 10px;
background-color: #674ea7;
color: white;
font-size: 16px;
cursor: pointer;
}

button:hover {
background-color: #351c75;
}

#reiniciar {
background-color: #e69138;
}

#capitulo {
color: #674ea7;
font-weight: bold;
}
</style>
</head>

<body>

<div class="caixa">
<h1>🔮 Aventura Mágica</h1>

<p id="capitulo">Capítulo 1</p>

<div id="texto">
Você é uma exploradora que encontrou um mapa mágico.
Ele mostra o caminho para um castelo misterioso.
Qual será sua primeira escolha?
</div>

<div id="botoes"></div>

<button id="reiniciar" onclick="iniciarJogo()">
🔄 Reiniciar aventura
</button>
</div>

<script>
const texto = document.getElementById("texto");
const botoes = document.getElementById("botoes");
const capitulo = document.getElementById("capitulo");

const cenas = {
inicio: {
numero: 1,
historia: "Você encontrou um mapa mágico que leva a um castelo. Para chegar até lá, precisa escolher entre uma floresta e uma montanha.",
opcoes: [
{
nome: "🌳 Entrar na floresta",
proxima: "floresta"
},
{
nome: "⛰️ Subir a montanha",
proxima: "montanha"
}
]
},

floresta: {
numero: 2,
historia: "Na floresta, você encontrou uma fada que oferece ajuda. Ela pergunta se você deseja receber uma poção mágica ou uma espada.",
opcoes: [
{
nome: "🧪 Pegar a poção",
proxima: "pocao"
},
{
nome: "⚔️ Pegar a espada",
proxima: "espada"
}
]
},

montanha: {
numero: 2,
historia: "No alto da montanha, você encontrou um dragão guardando uma passagem. Ele promete deixar você passar se resolver um enigma.",
opcoes: [
{
nome: "🧩 Resolver o enigma",
proxima: "enigma"
},
{
nome: "🕊️ Conversar com o dragão",
proxima: "dragao"
}
]
},

pocao: {
numero: 3,
historia: "A poção deu a você poderes mágicos! Com eles, você abriu o portão do castelo e encontrou um tesouro encantado.",
final: "🏆 Final 1: A guardiã da magia!"
},

espada: {
numero: 3,
historia: "Com a espada, você venceu os desafios do castelo e encontrou uma coroa mágica. Agora você é a heroína do reino!",
final: "👑 Final 2: A heroína do reino!"
},

enigma: {
numero: 3,
historia: "Você resolveu o enigma corretamente. O dragão ficou impressionado e revelou a localização de um tesouro escondido.",
final: "💎 Final 3: O tesouro secreto!"
},

dragao: {
numero: 3,
historia: "Você conversou com o dragão e descobriu que ele era amigável. Ele levou você até o castelo e mostrou uma biblioteca cheia de segredos.",
final: "📚 Final 4: A descoberta mágica!"
}
};

function mostrarCena(nome) {
const cena = cenas[nome];

capitulo.textContent = "Capítulo " + cena.numero;
texto.textContent = cena.historia;
botoes.innerHTML = "";

if (cena.final) {
const resultado = document.createElement("h2");
resultado.textContent = cena.final;
texto.appendChild(resultado);

const mensagem = document.createElement("p");
mensagem.textContent =
"Parabéns! Você concluiu esta aventura.";
texto.appendChild(mensagem);

return;
}

cena.opcoes.forEach(function(opcao) {
const botao = document.createElement("button");

botao.textContent = opcao.nome;

botao.addEventListener("click", function() {
mostrarCena(opcao.proxima);
});

botoes.appendChild(botao);
});
}

function iniciarJogo() {
mostrarCena("inicio");
}

iniciarJogo();
</script>

</body>
</html>
